name: probe-api
on:
  push:
    branches: [probe-api]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/probe.js
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: out }
