name: Imágenes y datos en vivo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/meta.json
      - tools/fetch-live.js
      - .github/workflows/live.yml

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar imágenes y datos
        run: node tools/fetch-live.js
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "live: imágenes y datos actualizados"
          git pull --rebase origin main
          git push origin HEAD:main
